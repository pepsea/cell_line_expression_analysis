# 常時稼働用の構成 / always-on deployment.
#
#   1. データベースを作る（初回のみ、データ更新時も）
#      --build を付けるのは、compose がコード変更を検知してイメージを作り直して
#      くれないため。古いイメージのまま新しいオプションを渡すと
#      "unrecognized arguments" になります。
#      HPA_SOURCE_DIR=/path/to/hpa-files docker compose run --rm --build build \
#        --expression  /source/rna_celline.tsv.zip \
#        --metadata    /source/cell_line_analysis_data.tsv.zip \
#        --tcga        /source/rna_cell_line_tcga_comparison.tsv.zip \
#        --cellosaurus /source/cellosaurus.txt \
#        --release     "HPA v24"
#
#   2. 常設起動
#      docker compose up -d
#
#   UI の動作確認だけなら 1 の代わりに:  docker compose run --rm demo

x-common: &common
  build:
    context: .
  image: hpa-cellexp:latest
  environment:
    # The path is what makes `serve` and `build` agree on one database.
    HPA_CELLEXP_DB: /data/hpa_cellexp.sqlite
    # Reference tables (tcga_organ.tsv, labels_ja.tsv, cell_line_organ.tsv,
    # organ_keywords.tsv) taken from the mounted folder when present, from the
    # packaged copy otherwise - per file, so overriding one is enough.
    HPA_CELLEXP_REFERENCE_DIR: /reference
    # Default for `build --cellosaurus`, so the path is configuration rather
    # than something to retype.  Harmless if the file is not there.
    HPA_CELLEXP_CELLOSAURUS: ${HPA_CELLOSAURUS_FILE:-/cellosaurus/cellosaurus.txt}
  volumes:
    # Named volume: no host uid/gid juggling, and it survives `down`/rebuilds.
    # To keep the database on the host instead, replace with a bind mount and
    # chown it to uid 10001 (see README).
    - cellexp-data:/data
    # Your HPA downloads, read-only.  Only build/demo need them.
    - ${HPA_SOURCE_DIR:-./hpa-source}:/source:ro
    # Curated reference tables, edited without rebuilding the image.
    - ${HPA_REFERENCE_DIR:-./reference}:/reference:ro
    # cellosaurus.txt lives on its own: it is ~200 MiB and updated on
    # Cellosaurus's release schedule, not with the HPA downloads.
    - ${HPA_CELLOSAURUS_DIR:-./cellosaurus}:/cellosaurus:ro

services:
  web:
    <<: *common
    container_name: hpa-cellexp
    # Comes back after a crash and after a host reboot, but stays down if you
    # deliberately stop it.
    restart: unless-stopped
    ports:
      # LEFT = the port you browse to on the host, RIGHT = inside the container.
      # Change the port by setting HPA_CELLEXP_PORT (see .env.example); the
      # container keeps listening on 8000, so nothing else needs touching.
      # To reach it only through a reverse proxy, prefix with 127.0.0.1:
      #   - "127.0.0.1:${HPA_CELLEXP_PORT:-8000}:8000"
      - "${HPA_CELLEXP_PORT:-8000}:8000"
    environment:
      # A service-level `environment:` REPLACES the anchor's, so everything
      # from x-common has to be repeated here - not merged.
      HPA_CELLEXP_DB: /data/hpa_cellexp.sqlite
      HPA_CELLEXP_REFERENCE_DIR: /reference
      HPA_CELLEXP_CELLOSAURUS: ${HPA_CELLOSAURUS_FILE:-/cellosaurus/cellosaurus.txt}
      # Pinned: the container-internal port is the right-hand side of the
      # ports mapping below.  Left unset it would inherit HPA_CELLEXP_PORT from
      # .env, move the listener, and stop matching the mapping.
      HPA_CELLEXP_PORT: "8000"
      # Reads are served from a read-only SQLite handle, so workers scale
      # safely. 1 is plenty for a lab-sized deployment.
      HPA_CELLEXP_WORKERS: ${HPA_CELLEXP_WORKERS:-1}
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8000/api/meta", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot helpers.  The subcommand lives in `entrypoint`, not `command`,
  # because `docker compose run SERVICE ARGS...` REPLACES command - so with
  # `command: ["build"]` the subcommand would be dropped the moment you passed
  # --expression.  As an entrypoint it is always kept and your arguments are
  # appended to it.

  # Build the database into the same volume the web service reads.
  build:
    <<: *common
    profiles: ["tools"]
    entrypoint: ["python", "-m", "hpa_cellexp", "build"]

  # Synthetic demo database, for checking the UI without real data.
  demo:
    <<: *common
    profiles: ["tools"]
    entrypoint: ["python", "-m", "hpa_cellexp", "demo"]

  # Show where each cell line's 由来臓器 came from.
  organs:
    <<: *common
    profiles: ["tools"]
    entrypoint: ["python", "-m", "hpa_cellexp", "organs"]

  # Print the header and first rows of an input file.
  inspect:
    <<: *common
    profiles: ["tools"]
    entrypoint: ["python", "-m", "hpa_cellexp", "inspect"]

volumes:
  cellexp-data:
